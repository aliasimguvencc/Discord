<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord Bulut Klonu</title>
    <!-- Supabase v2 Kütüphanesi -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { display: flex; height: 100vh; background-color: #313338; color: #dbdee1; overflow: hidden; }
        
        /* Giriş Ekranı */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .modal-box { background: #313338; padding: 32px; border-radius: 8px; width: 400px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
        .modal-box h2 { color: #f2f3f5; margin-bottom: 20px; font-size: 22px; text-align: center; }
        .input-group { margin-bottom: 16px; }
        .input-group label { display: block; font-size: 12px; font-weight: bold; color: #b5bac1; margin-bottom: 6px; text-transform: uppercase; }
        .input-group input { width: 100%; padding: 10px; background: #1e1f22; border: none; border-radius: 4px; color: #dbdee1; outline: none; font-size: 15px; }
        .btn { width: 100%; background: #5865f2; color: white; border: none; padding: 12px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 15px; }
        .btn:hover { background: #4752c4; }
        .toggle-auth { margin-top: 15px; text-align: center; font-size: 14px; color: #00a8fc; cursor: pointer; }

        /* Discord Arayüzü */
        .app-container { display: flex; width: 100%; height: 100%; display: none; }
        .servers-sidebar { width: 72px; background-color: #1e1f22; display: flex; flex-direction: column; align-items: center; padding-top: 12px; gap: 8px; }
        .server-icon { width: 48px; height: 48px; background-color: #5865f2; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-weight: bold; color: white; font-size: 20px; }
        
        .channels-sidebar { width: 240px; background-color: #2b2d31; display: flex; flex-direction: column; padding: 16px; border-right: 1px solid #1f2023; }
        .channel-title { font-size: 12px; font-weight: bold; margin-bottom: 8px; color: #949ba4; text-transform: uppercase; }
        .channel-item { padding: 8px; border-radius: 4px; cursor: pointer; margin-bottom: 2px; color: #949ba4; font-weight: 500; }
        .channel-item:hover { background-color: #35373c; color: #dbdee1; }
        .channel-item.active { background-color: #404249; color: white; }

        .chat-area { flex: 1; display: flex; flex-direction: column; background-color: #313338; }
        .chat-header { height: 48px; border-bottom: 1px solid #1f2023; display: flex; align-items: center; padding: 0 16px; font-weight: bold; color: white; }
        .chat-messages { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }
        .message { display: flex; gap: 16px; }
        .message img.avatar { width: 40px; height: 40px; border-radius: 50%; background: #5865f2; }
        .message-content .user { font-weight: bold; color: white; font-size: 14px; margin-bottom: 4px; }
        .message-content .text { color: #dbdee1; font-size: 14px; word-break: break-all; }
        
        .chat-input-area { padding: 16px; }
        .chat-input-wrapper { background-color: #383a40; border-radius: 8px; padding: 10px 16px; display: flex; align-items: center; gap: 10px; }
        .chat-input-wrapper input { flex: 1; background: transparent; border: none; color: white; outline: none; font-size: 15px; }
        .upload-label { cursor: pointer; color: #b5bac1; font-size: 20px; }
        .upload-label:hover { color: white; }
        #fileInput { display: none; }
    </style>
</head>
<body>

    <!-- GİRİŞ / KAYIT MODALI -->
    <div id="authModal" class="modal-overlay">
        <div class="modal-box">
            <h2 id="modalTitle">Discord'a Giriş Yap</h2>
            <div class="input-group">
                <label>E-posta Adresi</label>
                <input type="email" id="email" placeholder="ornek@gmail.com">
            </div>
            <div class="input-group">
                <label>Şifre</label>
                <input type="password" id="password" placeholder="••••••••">
            </div>
            <button class="btn" id="authBtn" onclick="handleAuth()">Giriş Yap</button>
            <div class="toggle-auth" id="toggleAuthText" onclick="toggleAuthMode()">Hesabın yok mu? Kayıt ol</div>
        </div>
    </div>

    <!-- ANA EKRAN -->
    <div class="app-container" id="appContainer">
        <div class="servers-sidebar">
            <div class="server-icon" title="Sunucu">D</div>
        </div>

        <div class="channels-sidebar">
            <div class="channel-title">Metin Kanalları</div>
            <div class="channel-item active" onclick="switchChannel('genel')"># genel</div>
            <div class="channel-item" onclick="switchChannel('sohbet')"># sohbet</div>
            <div class="channel-item" onclick="switchChannel('oyun')"># oyun</div>
        </div>

        <div class="chat-area">
            <div class="chat-header" id="currentChannelTitle"># genel</div>
            <div class="chat-messages" id="chatMessages"></div>
            <div class="chat-input-area">
                <div class="chat-input-wrapper">
                    <label class="upload-label" title="PNG Yükle">
                        +
                        <input type="file" id="fileInput" accept="image/png" onchange="uploadPNG(this)">
                    </label>
                    <input type="text" id="messageInput" placeholder="#genel kanalına mesaj gönder" onkeypress="handleKeyPress(event)">
                </div>
            </div>
        </div>
    </div>

    <script>
        // Yeni Supabase Bağlantı Bilgileri
        const SUPABASE_URL = 'https://aishcztrapnaxmbnjogr.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_wIsyK9CDenKG2U19mQ8VAA_6hrIchYZ';

        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let isRegisterMode = false;
        let currentChannel = 'genel';
        let currentUser = null;

        function toggleAuthMode() {
            isRegisterMode = !isRegisterMode;
            document.getElementById('modalTitle').innerText = isRegisterMode ? 'Yeni Hesap Oluştur' : "Discord'a Giriş Yap";
            document.getElementById('authBtn').innerText = isRegisterMode ? 'Kayıt Ol' : 'Giriş Yap';
            document.getElementById('toggleAuthText').innerText = isRegisterMode ? 'Zaten hesabın var mı? Giriş yap' : "Hesabın yok mu? Kayıt ol";
        }

        async function handleAuth() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();

            if (!email || !password) {
                alert('Lütfen e-posta ve şifrenizi girin.');
                return;
            }

            if (isRegisterMode) {
                const { data, error } = await supabase.auth.signUp({ email, password });
                if (error) {
                    alert('Kayıt Hatası: ' + error.message);
                    return;
                }
                alert('Kayıt başarılı! E-postanıza gelen doğrulama linkine tıkladıktan sonra giriş yapabilirsiniz.');
                isRegisterMode = false;
                toggleAuthMode();
            } else {
                const { data, error } = await supabase.auth.signInWithPassword({ email, password });
                if (error) {
                    alert('Giriş Hatası: ' + error.message);
                    return;
                }
                
                currentUser = data.user;
                document.getElementById('authModal').style.display = 'none';
                document.getElementById('appContainer').style.display = 'flex';
                loadMessages();
                listenMessages();
            }
        }

        function switchChannel(channel) {
            currentChannel = channel;
            document.getElementById('currentChannelTitle').innerText = '#' + channel;
            document.getElementById('messageInput').placeholder = `#${channel} kanalına mesaj gönder`;
            loadMessages();
        }

        async function handleKeyPress(e) {
            if (e.key === 'Enter') {
                const input = document.getElementById('messageInput');
                const text = input.value.trim();
                if (!text || !currentUser) return;

                const { error } = await supabase.from('messages').insert([{
                    text: text,
                    user_email: currentUser.email,
                    channel: currentChannel,
                    type: 'text'
                }]);

                if (error) {
                    alert('Mesaj gönderilemedi: ' + error.message);
                    return;
                }
                input.value = '';
            }
        }

        async function uploadPNG(input) {
            const file = input.files[0];
            if (!file || !currentUser) return;

            if (file.type !== 'image/png') {
                alert('Sadece PNG formatında görsel yükleyebilirsiniz!');
                return;
            }

            const fileName = `${Date.now()}_${file.name}`;
            const { error } = await supabase.storage.from('uploads').upload(fileName, file);

            if (error) {
                alert('Dosya yükleme hatası: ' + error.message);
                return;
            }

            const { data: publicUrlData } = supabase.storage.from('uploads').getPublicUrl(fileName);
            const imageUrl = publicUrlData.publicUrl;

            await supabase.from('messages').insert([{
                text: imageUrl,
                user_email: currentUser.email,
                channel: currentChannel,
                type: 'image'
            }]);
        }

        async function loadMessages() {
            const chatMessages = document.getElementById('chatMessages');
            const { data, error } = await supabase
                .from('messages')
                .select('*')
                .eq('channel', currentChannel)
                .order('created_at', { ascending: true });

            if (error) return;

            chatMessages.innerHTML = '';
            data.forEach(msg => appendMessage(msg));
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function listenMessages() {
            supabase
                .channel('public:messages')
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
                    if (payload.new.channel === currentChannel) {
                        appendMessage(payload.new);
                        const chatMessages = document.getElementById('chatMessages');
                        chatMessages.scrollTop = chatMessages.scrollHeight;
                    }
                })
                .subscribe();
        }

        function appendMessage(msg) {
            const chatMessages = document.getElementById('chatMessages');
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message';
            
            const username = msg.user_email.split('@')[0];
            let contentHtml = `<div class="text">${msg.text}</div>`;
            
            if (msg.type === 'image') {
                contentHtml = `<div class="text"><img src="${msg.text}" style="max-width: 250px; border-radius: 8px; margin-top: 5px;"></div>`;
            }

            msgDiv.innerHTML = `
                <img class="avatar" src="https://api.dicebear.com/7.x/identicon/svg?seed=${username}" alt="avatar">
                <div class="message-content">
                    <div class="user">${username}</div>
                    ${contentHtml}
                </div>
            `;
            chatMessages.appendChild(msgDiv);
        }
    </script>
</body>
</html>
