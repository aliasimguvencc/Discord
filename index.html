<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Discord</title>
    <style>
        body { font-family: Arial, sans-serif; background: #313338; color: #dbdee1; margin: 0; display: flex; height: 100vh; }
        .sidebar { width: 240px; background: #2b2d31; padding: 20px; border-right: 1px solid #1f2023; }
        .chat-area { flex: 1; display: flex; flex-direction: column; }
        .messages { flex: 1; padding: 20px; overflow-y: auto; }
        .input-box { padding: 20px; background: #383a40; display: flex; gap: 10px; }
        input, button { padding: 10px; border-radius: 4px; border: none; }
        input { flex: 1; background: #1e1f22; color: white; }
        button { background: #5865f2; color: white; cursor: pointer; }
    </style>
</head>
<body>

    <div class="sidebar">
        <h3>Kanallar</h3>
        <p># genel-sohbet</p>
    </div>

    <div class="chat-area">
        <div class="messages" id="messageList">
            <!-- Mesajlar buraya gelecek -->
        </div>
        <div class="input-box">
            <input type="text" id="messageInput" placeholder="Mesaj yaz veya PNG sürükle...">
            <button onclick="sendMessage()">Gönder</button>
        </div>
    </div>

    <!-- Supabase Kütüphanesi -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>
</body>
</html>
